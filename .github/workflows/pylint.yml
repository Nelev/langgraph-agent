name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync
    - name: Analysing the code with pylint
      run: uv run pylint $(git ls-files '*.py')
